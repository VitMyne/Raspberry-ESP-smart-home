<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Home Client</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131a; color: #eef2ff; }
    body { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
    header, .toolbar, .device, .command, .device-actions { display: flex; gap: .75rem; align-items: center; }
    header { justify-content: space-between; } button { background: #4f7cff; color: white; border: 0; border-radius: .45rem; padding: .6rem .9rem; cursor: pointer; }
    button:hover { background: #3c67de; } button.selected { outline: 3px solid #99b3ff; }
    #rooms { display: grid; gap: .7rem; margin: 1rem 0 1.5rem; }
    .room, .device, .command, .settings { background: #1b2130; border-radius: .6rem; }
    .room { overflow: hidden; }
    .room > summary { display: flex; gap: .65rem; align-items: center; padding: 1rem; cursor: pointer; list-style: none; }
    .room > summary::-webkit-details-marker { display: none; }
    .room > summary::before { content: ">"; width: 1rem; color: #aeb9d2; font-family: ui-monospace, monospace; }
    .room[open] > summary::before { content: "v"; }
    .room-name { font-size: 1.15rem; font-weight: 650; }
    .room-body { padding: 0 1rem 1rem; }
    .room .device { margin-top: .7rem; background: #252e42; padding: 1rem; flex-wrap: wrap; }
    #developer-command[hidden] { display: none; }
    .device-actions { flex-wrap: wrap; } .typed-command { display: flex; gap: .4rem; align-items: center; }
    .device .details { flex: 1; min-width: 150px; } .id { color: #aeb9d2; font-family: ui-monospace, monospace; font-size: .85rem; }
    .device input[data-name-room] { width: 130px; }
    .device-select { display: none; }
    body.developer-mode .device-select { display: inline-block; }
    input, textarea { background: #0e1320; color: inherit; border: 1px solid #4a5875; border-radius: .35rem; padding: .55rem; }
    textarea { width: 100%; min-height: 130px; resize: vertical; font-family: ui-monospace, monospace; }
    .status { min-height: 1.5rem; color: #a9c5ff; } .error { color: #ff9b9b; }
    .settings { margin: 1rem 0; } .settings summary { cursor: pointer; font-weight: 600; } .settings label { display: inline-flex; gap: .5rem; align-items: center; margin-top: .8rem; }
  </style>
</head>
<body>
  <header><h1>Smart Home</h1><button id="refresh">Refresh rooms</button></header>
  <p id="status" class="status">Loading rooms…</p>
  <details class="settings">
    <summary>Settings</summary>
    <label><input id="developer-mode" type="checkbox"> Developer mode — allow custom JSON commands</label>
  </details>
  <section id="rooms"></section>
  <section id="developer-command" class="command" hidden>
    <strong id="selected">Select a room device</strong>
    <label for="command">Custom command JSON</label>
    <textarea id="command" spellcheck="false">{"cmd": "on"}</textarea>
    <button id="send" disabled>Send custom command</button>
  </section>
  <script>
    const state = { rooms: {}, names: {}, selected: null, openRooms: new Set() };
    const roomsElement = document.querySelector('#rooms');
    const statusElement = document.querySelector('#status');
    const selectedElement = document.querySelector('#selected');
    const sendButton = document.querySelector('#send');
    const developerModeToggle = document.querySelector('#developer-mode');
    const developerCommandElement = document.querySelector('#developer-command');

    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function setStatus(message, error = false) { statusElement.textContent = message; statusElement.className = error ? 'status error' : 'status'; }
    function setDeveloperMode(enabled) {
      document.body.classList.toggle('developer-mode', enabled);
      developerCommandElement.hidden = !enabled;
    }
    function render() {
      const entries = Object.entries(state.rooms);
      if (!entries.length) { roomsElement.innerHTML = '<p>No rooms are currently discovered by the server.</p>'; return; }
      roomsElement.innerHTML = entries.map(([roomId, room]) => `
        <details class="room" data-room="${escapeHtml(roomId)}" ${state.openRooms.has(roomId) ? 'open' : ''}>
        <summary><span class="room-name">${escapeHtml(state.names[roomKey(roomId)] || roomId)}</span><span class="id">${escapeHtml(roomId)} · Controller: ${escapeHtml(room.address)}</span></summary>
        <div class="room-body"><input data-room-name="${escapeHtml(roomId)}" aria-label="Friendly room name for ${escapeHtml(roomId)}" value="${escapeHtml(state.names[roomKey(roomId)] || '')}" placeholder="Friendly room name">
        ${Object.entries(room.devices).map(([deviceId, device]) => {
          const key = deviceKey(roomId, deviceId); const selected = state.selected && state.selected.room === roomId && state.selected.device === deviceId;
          return `<article class="device"><div class="details"><strong>${escapeHtml(state.names[key] || deviceId)}</strong><div class="id">${escapeHtml(deviceId)}</div></div>
          <input data-name-room="${escapeHtml(roomId)}" data-name-device="${escapeHtml(deviceId)}" value="${escapeHtml(state.names[key] || '')}" placeholder="Friendly name">
          <button data-select-room="${escapeHtml(roomId)}" data-select-device="${escapeHtml(deviceId)}" class="device-select ${selected ? 'selected' : ''}">Select</button>
          <div class="device-actions">${device.cmds.map(command => commandControl(roomId, deviceId, command)).join('') || '<span class="id">No commands advertised</span>'}</div></article>`;
        }).join('')}</div></details>`).join('');
      document.querySelectorAll('details[data-room]').forEach(room => room.addEventListener('toggle', () => {
        if (room.open) state.openRooms.add(room.dataset.room);
        else state.openRooms.delete(room.dataset.room);
      }));
      document.querySelectorAll('[data-select-room]').forEach(button => button.onclick = () => selectDevice(button.dataset.selectRoom, button.dataset.selectDevice));
      document.querySelectorAll('[data-name-room]').forEach(input => input.onchange = () => saveName(input.dataset.nameRoom, input.dataset.nameDevice, input.value));
      document.querySelectorAll('[data-room-name]').forEach(input => input.onchange = () => saveRoomName(input.dataset.roomName, input.value));
      document.querySelectorAll('[data-raw-command]').forEach(button => button.onclick = () => sendCommand(button.dataset.room, button.dataset.device, {cmd: button.dataset.rawCommand}));
      document.querySelectorAll('[data-run-command]').forEach(button => button.onclick = () => runTypedCommand(button));
    }
    function deviceKey(room, device) { return `${room}/${device}`; }
    function roomKey(room) { return `@room:${room}`; }
    function commandControl(room, device, command) {
      const name = escapeHtml(command.name); const type = escapeHtml(command.type); const roomId = escapeHtml(room); const deviceId = escapeHtml(device);
      if (command.type === 'raw') return `<button data-raw-command="${name}" data-room="${roomId}" data-device="${deviceId}">${name}</button>`;
      const input = command.type === 'int'
        ? `<input data-command-value type="number" step="1" placeholder="number">`
        : command.type === 'list'
          ? `<input data-command-value placeholder='["item"]'>`
          : `<input data-command-value type="text" placeholder="text">`;
      return `<span class="typed-command"><label>${name} (${type}) ${input}</label><button data-run-command data-room="${roomId}" data-device="${deviceId}" data-command-name="${name}" data-command-type="${type}">Send</button></span>`;
    }
    function selectDevice(room, device) {
      state.selected = {room, device}; const key = deviceKey(room, device); selectedElement.textContent = `Selected: ${room} / ${state.names[key] || device}`; sendButton.disabled = false; render();
    }
    async function refresh() {
      setStatus('Loading rooms…');
      try { const response = await fetch('/api/rooms'); const data = await response.json(); if (!response.ok) throw Error(data.error); state.rooms = data.rooms; state.names = data.names; render(); setStatus(`${Object.keys(data.rooms).length} room(s) found.`); }
      catch (error) { setStatus(error.message, true); }
    }
    async function saveName(room, device, name) {
      try { const response = await fetch('/api/names', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room, device, name})}); const data = await response.json(); if (!response.ok) throw Error(data.error); state.names[deviceKey(room, device)] = name.trim(); render(); setStatus('Name saved.'); }
      catch (error) { setStatus(error.message, true); }
    }
    async function saveRoomName(room, name) {
      try { const response = await fetch('/api/names', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room, name})}); const data = await response.json(); if (!response.ok) throw Error(data.error); state.names[roomKey(room)] = name.trim(); render(); setStatus('Room name saved.'); }
      catch (error) { setStatus(error.message, true); }
    }
    async function sendCommand(room, device, command) {
      try { const response = await fetch('/api/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({room, device, command})}); const data = await response.json(); if (!response.ok) throw Error(data.error); setStatus(data.response); }
      catch (error) { setStatus(error.message, true); }
    }
    function runTypedCommand(button) {
      const input = button.parentElement.querySelector('[data-command-value]');
      let value = input.value;
      if (button.dataset.commandType === 'int') {
        if (!/^-?\d+$/.test(value)) { setStatus('Enter a whole number.', true); return; }
        value = Number(value);
      } else if (button.dataset.commandType === 'list') {
        try { value = JSON.parse(value); if (!Array.isArray(value)) throw Error(); }
        catch (_) { setStatus('Enter a JSON list, for example ["weekday", "weekend"].', true); return; }
      }
      sendCommand(button.dataset.room, button.dataset.device, {[button.dataset.commandName]: value});
    }
    sendButton.onclick = async () => {
      let command; try { command = JSON.parse(document.querySelector('#command').value); if (!command || Array.isArray(command) || typeof command !== 'object') throw Error('The command must be a JSON object.'); }
      catch (error) { setStatus(`Invalid JSON: ${error.message}`, true); return; }
      await sendCommand(state.selected.room, state.selected.device, command);
    };
    developerModeToggle.checked = localStorage.getItem('smart-home-developer-mode') === 'true';
    setDeveloperMode(developerModeToggle.checked);
    developerModeToggle.onchange = () => {
      localStorage.setItem('smart-home-developer-mode', developerModeToggle.checked);
      setDeveloperMode(developerModeToggle.checked);
    };
    document.querySelector('#refresh').onclick = refresh; refresh();
  </script>
</body>
</html>
